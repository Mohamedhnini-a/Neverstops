name: Update subscription

on:
  schedule:
    # كنصيحة: كل 5 دقائق كتستهلك بزاف ديال الموارد وتغبر فـ GitHub. يفضل كل 6 سوايع.
    - cron: '0 */6 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. إعداد لغة Python بدل Node
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2. تثبيت مكتبة requests اللي كيستعملها السكريبت
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 3. تحميل Xray (السكريبت ديالك محتاجو باش يختبر الكونفيغات)
      - name: Download Xray
        run: |
          XRAY_VERSION="v26.7.28"
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -O xray.zip
          unzip -q xray.zip -d xray
          chmod +x xray/xray
          ./xray/xray version

      # 4. تشغيل سكريبت بايثون
      - name: Generate sub.txt
        run: python generate.py

      # 5. الحفظ والرفع
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git diff --cached --quiet || git commit -m "Update subscription"
          git push
